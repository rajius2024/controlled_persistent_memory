# Default configuration for Controlled Persistent Memory project
# All methods read from this file to ensure fair comparison

# ── Embedding ─────────────────────────────────────────────────────────────────
embedding_model: "all-MiniLM-L6-v2"
embedding_dim: 384
embedding_cache_dir: ".cache/embeddings"

# ── Retrieval ─────────────────────────────────────────────────────────────────
top_k: 15
recency_weight: 0.15
context_cap_chars: 8000

# ── LLM ───────────────────────────────────────────────────────────────────────
llm_model: "llama-3.3-70b-versatile"
llm_max_tokens: 10
llm_temperature: 0.0
rate_limit_sleep: 2.0

# ── Data paths (override for Sol Supercomputer) ───────────────────────────────
data_dir: "data"
results_dir: "results"
chroma_dir: ".cache/chroma"

# ── Evaluation ────────────────────────────────────────────────────────────────
dev_10_path: "data/dev_10.jsonl"
dev_50_path: "data/dev_50.jsonl"
dev_100_path: "data/dev_100.jsonl"
full_path: "data/dev_589.jsonl"
